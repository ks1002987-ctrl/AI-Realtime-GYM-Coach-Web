<!DOCTYPE html>
<html>
<head>
<title>AI GYM Trainer - All Exercises</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial}
h1{color:#39ff14}
button{padding:12px 18px;margin:5px;font-size:16px;border-radius:10px;border:none;cursor:pointer;background:#222;color:#fff}
button.active{background:#39ff14;color:#000;font-weight:bold}
#count{font-size:50px;color:#39ff14}
.box{display:inline-block;background:#111;padding:15px 25px;border-radius:15px;margin:10px}
video{width:90%;max-width:700px;border:3px solid #39ff14;border-radius:15px;transform:scaleX(-1)}
</style>
</head>
<body>
<h1>AI Real-time GYM Trainer</h1>
<p>Exercise select karo, Start dabao, aur karo!</p>

<div>
<button onclick="setEx('squat',this)" class="active">Squat</button>
<button onclick="setEx('pushup',this)">Pushup</button>
<button onclick="setEx('bicep',this)">Bicep Curl</button>
<button onclick="setEx('shoulder',this)">Shoulder Press</button>
<button onclick="setEx('lunge',this)">Lunge</button>
</div>

<div class="box"><div id="exName">SQUAT</div><div id="count">0</div></div>
<div class="box"><div>STAGE</div><div id="stage">-</div></div>
<br>
<button onclick="startCam()" style="background:#39ff14;color:#000;font-weight:bold">Start Camera</button>
<br><br>
<video id="video" playsinline></video>

<script>
let ex='squat', count=0, stage='-';
let video=document.getElementById('video');
function setEx(e,btn){
  ex=e; count=0; stage='-';
  document.getElementById('count').innerText=0;
  document.getElementById('exName').innerText=e.toUpperCase();
  document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function getAngle(a,b,c){
  let ab={x:a.x-b.x,y:a.y-b.y}, cb={x:c.x-b.x,y:c.y-b.y};
  let dot=ab.x*cb.x+ab.y*cb.y;
  let mag1=Math.sqrt(ab.x*ab.x+ab.y*ab.y), mag2=Math.sqrt(cb.x*cb.x+cb.y*cb.y);
  let ang=Math.acos(dot/(mag1*mag2))*180/Math.PI;
  return ang;
}
function onResults(res){
  if(!res.poseLandmarks) return;
  let lm=res.poseLandmarks;
  let angle=0;
  // 11,13,15 = shoulder, elbow, wrist (left) | 23,25,27 = hip, knee, ankle
  if(ex=='squat') angle=getAngle(lm[23],lm[25],lm[27]);
  if(ex=='bicep') angle=getAngle(lm[11],lm[13],lm[15]);
  if(ex=='shoulder') angle=getAngle(lm[23],lm[11],lm[13]); // hip-shoulder-elbow
  if(ex=='lunge') angle=getAngle(lm[23],lm[25],lm[27]);
  if(ex=='pushup') angle=getAngle(lm[11],lm[13],lm[15]);

  let newStage=stage;
  if(ex=='squat' || ex=='lunge'){
    if(angle>160) newStage='UP';
    if(angle<90 && stage=='UP'){ count++; newStage='DOWN'; }
    if(angle<90) newStage='DOWN';
  }
  if(ex=='bicep' || ex=='pushup'){
    if(angle>150) newStage='DOWN';
    if(angle<60 && stage=='DOWN'){ count++; newStage='UP'; }
    if(angle<60) newStage='UP';
  }
  if(ex=='shoulder'){
    if(angle<70) newStage='DOWN';
    if(angle>150 && stage=='DOWN'){ count++; newStage='UP'; }
    if(angle>150) newStage='UP';
  }
  stage=newStage;
  document.getElementById('count').innerText=count;
  document.getElementById('stage').innerText=stage + ' | ' + Math.round(angle)+'°';
}
let pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
pose.onResults(onResults);
function startCam(){
  let cam=new Camera(video,{onFrame:async()=>{await pose.send({image:video})},width:640,height:480});
  cam.start();
}
</script>
</body>
</html>
